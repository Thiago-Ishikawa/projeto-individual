<script>
    const div_msg = document.getElementById("div_msg");

    function entrar(){
        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if(emailVar == "" || senhaVar == ""){
            div_msg.innerHTML = `Preencha os campos em branco!`;
            finalizarAguardar && finalizarAguardar(); // garantir que loading seja finalizado se existir
            return false; // não prosseguir com fetch
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    showAlert("Entrando na conta...");
                    setTimeout(function () {
                        window.location = "./dashboard.html";
                    }, 1200); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    
                    div_msg.innerText = texto || 'Email e/ou senha incorretos.';
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

    function showAlert(message) {
        if (!div_msg) return;
        div_msg.innerText = message;
        div_msg.style.backgroundColor = '#FFC857';
        div_msg.style.color = '#000000';
        div_msg.style.borderRadius = '10px';
        div_msg.style.padding = '20px 24px';
        div_msg.style.marginTop = '12px';
        div_msg.style.display = 'block';
        div_msg.style.textAlign = 'center';
    }

    const inputSenha = document.getElementById("ipt_senha");
    const textoCriptografia = document.getElementById("senha_cifrada");
    let hashRequestId = 0;

    function bufferParaHex(buffer) {
        return Array.from(new Uint8Array(buffer))
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");
    }

    function atualizarCriptografia(valor) {
        if (!textoCriptografia) return;

        if (!valor) {
            textoCriptografia.innerText = "Criptografia ativa: aguardando caracteres";
            return;
        }

        if (!window.crypto || !crypto.subtle) {
            textoCriptografia.innerText = "Criptografia não disponível neste navegador.";
            return;
        }

        const requestId = ++hashRequestId;
        try {
            const encoder = new TextEncoder();
            crypto.subtle.digest("SHA-256", encoder.encode(valor)).then(hashBuffer => {
                if (requestId !== hashRequestId) return;
                const hashHex = bufferParaHex(hashBuffer);
                textoCriptografia.innerText = `Criptografia SHA-256: ${hashHex.slice(0, 24)}...`;
            }).catch(() => {
                if (requestId !== hashRequestId) return;
                textoCriptografia.innerText = "Erro ao gerar a criptografia.";
            });
        } catch (erro) {
            textoCriptografia.innerText = "Erro ao gerar a criptografia.";
        }
    }

    if (inputSenha) {
        inputSenha.addEventListener("input", () => atualizarCriptografia(inputSenha.value));
        atualizarCriptografia(inputSenha.value);
    }

</script>
