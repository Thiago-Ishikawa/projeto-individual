<div class="bannerCadastro">
    
    <div class="containerCadastro">
        <h2>Criar sua conta<br><br></h2>
        <p>Faça parte da nossa comunidade e viva a experiência completa do Timbre<br><br></p>

        <div class="campo">
            <span>Nome Completo</span>
            <input type="text" id="nome_input" placeholder="meunomecompleto">
        </div>
        <div class="campo">
            <span>Senha</span>
            <input type="text" id="senha_input" placeholder="**********">
        </div>
        <div class="campo">
            <span>Confirmação da Senha</span>
            <input type="text" id="confirmacao_senha_input" placeholder="**********">
        </div>
        <div class="campo">
            <span>Email</span>
            <input type="text" id="email_input" placeholder="seuemail@gmail.com">
        </div>
        <div class="campo">
            <span>CPF</span>
            <input type="text" id="cpf_input" placeholder="xxx.xxx.xxx-xx">
        </div>

        <br><br>
        <button onclick="cadastrar()">Cadastrar</button>
        <div id="div_mensagem">

    </div>     
</div>
      
    <div id="div_erros_login"></div>

        </div>
    </div>
</div>

</body>

</script>

<script>
    function cadastrar(){

        var nomeVar = nome_input.value;
        var senhaVar = senha_input.value;
        var emailVar = email_input.value;
        var cpfVar = cpf_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var arroba = emailVar.includes('@');
        var pontoCom = emailVar.includes('.com');

    // validações básicas (mantidas no mesmo estilo original)
        if(
           nomeVar == "" || 
           senhaVar == "" || 
           emailVar == "" || 
           cpfVar == "" ||
           confirmacaoSenhaVar == ""
        ){
            alert(`Preencha os campos em branco!`);
            return false;
        }else if(arroba == false || pontoCom == false){
            alert(`Por favor, insira um e-mail válido com (@) e (.com)`);
            return false;
        }else if(senhaVar !== confirmacaoSenhaVar){
            alert(`As senhas não coincidem.`);
            return false;
        }

        // monta corpo conforme API web-data-viz
        fetch("/usuarios/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
            cpfServer: cpfVar
          }),
        })
          .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
              resposta.json().then(function(body){
                showAlert(body.mensagem || "Cadastro realizado com sucesso! Redirecionando para tela de Login...");
                setTimeout(() => { window.location = "login.html"; }, 2000);
              }).catch(function(){
                showAlert("Cadastro realizado com sucesso! Redirecionando para tela de Login...");
                setTimeout(() => { window.location = "login.html"; }, 2000);
              });

            } else {
              resposta.text().then(function(text){
                showAlert('Erro: ' + text);
              });
            }
          })
          .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
            showAlert('Erro de conexão com o servidor.');
          });

        return false;
    }

    // helper para mostrar alert estilizado
    function showAlert(message) {
        // utiliza o elemento existente div_mensagem
        div_mensagem.innerText = message;
        div_mensagem.style.backgroundColor = '#FFC857';
        div_mensagem.style.color = '#000000';
        div_mensagem.style.borderRadius = '10px';
        div_mensagem.style.padding = '20px 24px';
        div_mensagem.style.marginTop = '12px';
        div_mensagem.style.display = 'block';
        div_mensagem.style.width = '80%';
        div_mensagem.style.maxWidth = '520px';
        div_mensagem.style.height = '96px';
        div_mensagem.style.lineHeight = '1.4';
        div_mensagem.style.textAlign = 'center';
        div_mensagem.style.marginLeft = 'auto';
        div_mensagem.style.marginRight = 'auto';
    }
</script>
