<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Timbre</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* reduzir espaço entre pergunta e respostas */
        #perguntaDaQuestaoAtual { min-height: 40px; max-height: 120px; overflow: auto; padding-bottom: 4px; }
        #jogo { min-width: 420px; }
        #pontuacao { min-width: 220px; min-height: 80px; }
        /* garantir que labels das alternativas não quebrem o layout */
        .option { display: inline-block; max-width: 360px; word-wrap: break-word; }
    </style>
</head>
</head>

<body onload="onloadEsconder()">
    <div>
        <div id="pontuacaoEjogo">
            <button id="btnVoltarSimulador" onclick="window.location.href='../simulador.html'">Voltar ao Simulador</button>
            <button id="btnIniciar" onclick="iniciar()">Iniciar Quiz</button>
            <span id="msgSemQuiz" style="color:#f2b8b8; margin-left:12px; display:none">Nenhum quiz disponível no servidor.</span>
        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
        <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
            <span class="width-fit-content">Quantidade de acertos: <span id="spanCertas"></span></span>
            <span class="width-fit-content">Quantidade de erros: <span id="spanErradas"></span></span>
        </div>
        <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
            <span id="pontuacaoFinal" class="width-fit-content">Pontuação Final:
                <span id="spanPontuacaoFinal">***</span>
            </span>
            <span id="msgFinal" class="width-fit-content">***</span>
        </div>
    </div>
    
    <div id="jogo" class="width-fit-content flex-colunar border-secondary">

        <div id="infoQuestao" class="padding-8">
            <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                questões.</span>
        </div>

        <div id="perguntaDaQuestaoAtual" class="padding-8">
            <span id="spanQuestaoExibida" class="text-bold"></span>
        </div>

        <div id="infoAlternativas" class="padding-8">
            <span><em>Escolha uma opção dentre as abaixo:</em></span>
        </div>

        <div id="opcoes" class="flex-colunar padding-8">
            <span>
                <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
            </span>
            <span>
                <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
            </span>
            <span>
                <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
            </span>
            <span>
                <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
            </span>
        </div>

        <div id="botoes" class="flex-colunar padding-8">
            <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
            <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
            <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
            <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
        </div>

    </div>
</div>
</body>

<script>

let listaDeQuestoes = [
    {
        id_pergunta: 1,
        pergunta: 'Quem compôs a Nona Sinfonia?',
        tipo: 'unica',
        correta: 11,
        alternativas: [
            { id: 11, texto: 'Ludwig van Beethoven' },
            { id: 12, texto: 'Wolfgang Amadeus Mozart' },
            { id: 13, texto: 'Johann Sebastian Bach' },
            { id: 14, texto: 'Frédéric Chopin' }
        ]
    },
    {
        id_pergunta: 2,
        pergunta: 'Quantas teclas tem um piano acústico padrão?',
        tipo: 'unica',
        correta: 22,
        alternativas: [
            { id: 21, texto: '55' },
            { id: 22, texto: '88' },
            { id: 23, texto: '85' },
            { id: 24, texto: '72' }
        ]
    },
    {
    id_pergunta: 3,
    pergunta: 'Qual é a função dos pedais de um piano?',
    tipo: 'unica',
    correta: 32,
    alternativas: [
        { id: 31, texto: 'Alterar o volume das teclas' },
        { id: 32, texto: 'Modificar a sonoridade das notas' },
        { id: 33, texto: 'Aumentar a quantidade de teclas' },
        { id: 34, texto: 'Afinar automaticamente o piano' }
    ]
    },
    {
        id_pergunta: 4,
        pergunta: 'Qual é o nome das teclas pretas do piano?',
        tipo: 'unica',
        correta: 42,
        alternativas: [
            { id: 41, texto: 'Naturais' },
            { id: 42, texto: 'Sustenidos e bemóis' },
            { id: 43, texto: 'Harmônicas' },
            { id: 44, texto: 'Diatrônicas' }
        ]
    },
    {
        id_pergunta: 5,
        pergunta: 'Qual instrumento produz o som através de martelos que atingem cordas?',
        tipo: 'unica',
        correta: 53,
        alternativas: [
            { id: 51, texto: 'Violino' },
            { id: 52, texto: 'Flauta' },
            { id: 53, texto: 'Piano acústico' },
            { id: 54, texto: 'Trompete' }
        ]
    },
    {
    id_pergunta: 6,
    pergunta: 'Qual é a função do pedal sustain?',
    tipo: 'unica',
    correta: 62,
    alternativas: [
            { id: 61, texto: 'Aumentar a velocidade das notas' },
            { id: 62, texto: 'Manter as notas soando por mais tempo' },
            { id: 63, texto: 'Diminuir a afinação' },
            { id: 64, texto: 'Deixar o som mais grave' }
        ]
    },
    {
    id_pergunta: 7,
    pergunta: 'Qual é a primeira nota da sequência musical natural?',
    tipo: 'unica',
    correta: 73,
    alternativas: [
            { id: 71, texto: 'Ré' },
            { id: 72, texto: 'Mi' },
            { id: 73, texto: 'Dó' },
            { id: 74, texto: 'Sol' }
        ]
    },
    {
    id_pergunta: 8,
    pergunta: 'Qual compositor é conhecido por obras como Sonata ao Luar?',
    tipo: 'unica',
    correta: 82,
    alternativas: [
            { id: 81, texto: 'Wolfgang Amadeus Mozart' },
            { id: 82, texto: 'Ludwig van Beethoven' },
            { id: 83, texto: 'Frédéric Chopin' },
            { id: 84, texto: 'Johann Sebastian Bach' }
        ]
    },
    {
    id_pergunta: 9,
    pergunta: 'Como são chamadas as teclas brancas do piano?',
    tipo: 'unica',
    correta: 91,
    alternativas: [
            { id: 91, texto: 'Teclas naturais' },
            { id: 92, texto: 'Teclas cromáticas' },
            { id: 93, texto: 'Teclas harmônicas' },
            { id: 94, texto: 'Teclas alteradas' }
        ]
    }
];
let numeroDaQuestaoAtual = 0;
let pontuacaoFinal = 0;
let tentativaIncorreta = 0;
let certas = 0;
let erradas = 0;
let quantidadeDeQuestoes = 0;
let quizId = null; // será obtido do backend ou definido pelo usuário
let idTentativa = null;

function onloadEsconder() {
    document.getElementById('pontuacao').style.display = "none";
    document.getElementById('jogo').style.display = "none";
}

// No auto-load of quiz content. Leave fields empty so user can add questions later.
function carregarQuiz() {
    // intentionally empty: quiz questions are not auto-filled
    quantidadeDeQuestoes = listaDeQuestoes.length;
    document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes;
}

function iniciar() {
    document.getElementById('pontuacao').style.display = "flex";
    document.getElementById('jogo').style.display = "flex";
    document.getElementById('btnIniciar').style.display = "none";

    var userId = sessionStorage.ID_USUARIO || sessionStorage.ID || 1;
    fetch('/quiz/' + quizId + '/iniciar', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-user-id': userId }, body: JSON.stringify({ total_perguntas: quantidadeDeQuestoes }) })
        .then(function(r){
            if (!r.ok) return r.text().then(function(t){ throw new Error(t || 'Erro ao iniciar tentativa'); });
            // try parse json safely
            return r.text().then(function(t){ try { return JSON.parse(t); } catch(e){ return {}; } });
        }).then(function(json){
            idTentativa = json.id_tentativa || null;
            quantidadeDeQuestoes = listaDeQuestoes.length;
            document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes;
            preencherHTMLcomQuestaoAtual(0);
            document.getElementById('btnSubmeter').disabled = false;
            document.getElementById('btnProx').disabled = true;
            document.getElementById('btnTentarNovamente').disabled = true;
        }).catch(function(err){
            // show server message or generic
            alert('Erro ao iniciar a tentativa: ' + (err && err.message ? err.message : 'ver console'));
            console.error('Erro iniciar tentativa', err);
        });
}

function preencherHTMLcomQuestaoAtual(index) {
    habilitarAlternativas(true);
    const questaoAtual = listaDeQuestoes[index];
    numeroDaQuestaoAtual = index;
    document.getElementById('spanNumeroDaQuestaoAtual').innerHTML = Number(index) + 1;
    document.getElementById('spanQuestaoExibida').innerHTML = questaoAtual.pergunta || '';
    var labels = ['labelOpcaoUm','labelOpcaoDois','labelOpcaoTres','labelOpcaoQuatro'];
    var radios = document.getElementsByName('option');
    for (var i=0;i<4;i++){
        var lab = document.getElementById(labels[i]);
        if (questaoAtual.alternativas[i]){
            lab.innerHTML = questaoAtual.alternativas[i].texto;
            lab.dataset.altId = questaoAtual.alternativas[i].id;
            radios[i].value = questaoAtual.alternativas[i].id;
            labsShow(lab, radios[i], true);
        } else {
            lab.innerHTML = '';
            lab.dataset.altId = '';
            radios[i].value = '';
            labsShow(lab, radios[i], false);
        }
    }
}

function labsShow(label, radio, show){
    label.style.display = show ? '' : 'none';
    radio.style.display = show ? '' : 'none';
}

function submeter(){
    const options = document.getElementsByName('option');
    let hasChecked = false; var chosen = null;
    for (let i=0;i<options.length;i++){ if (options[i].checked){ hasChecked=true; chosen=options[i]; break; } }
    if (!hasChecked){ alert('Não há alternativas escolhidas. Escolha uma opção.'); return; }
    document.getElementById('btnSubmeter').disabled = true; document.getElementById('btnProx').disabled = false;
    habilitarAlternativas(false);
    var fk_pergunta = listaDeQuestoes[numeroDaQuestaoAtual].id_pergunta;
    var fk_alternativa = chosen ? chosen.value : null;
    fetch('/quiz/tentativa/' + idTentativa + '/responder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fk_pergunta: fk_pergunta, fk_alternativa: fk_alternativa }) })
        .then(r=>r.json()).then(function(){ checarResposta(); }).catch(function(err){ console.error('erro ao enviar resposta',err); checarResposta(); });
}

function habilitarAlternativas(trueOrFalse){
    let opcaoEscolhida = trueOrFalse ? false : true;
    primeiraOpcao.disabled = opcaoEscolhida; segundaOpcao.disabled = opcaoEscolhida; terceiraOpcao.disabled = opcaoEscolhida; quartaOpcao.disabled = opcaoEscolhida;
}

function avancar(){
    btnProx.disabled = true; btnSubmeter.disabled = false; desmarcarRadioButtons();
    if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) { preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual+1); }
    else { finalizarJogo(); }
    limparCoresBackgroundOpcoes();
}

function desmarcarRadioButtons(){ const options = document.getElementsByName('option'); for (let i=0;i<options.length;i++) options[i].checked=false; }

function checarResposta(){
    const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual];
    const options = document.getElementsByName('option');
    var chosen = null;
    for (let i=0;i<options.length;i++){ if (options[i].checked) chosen = options[i]; }

    if (!chosen) return; // nada selecionado (não deveria acontecer aqui)

    const corretaId = String(questaoAtual.correta || '');
    const escolhidaId = String(chosen.value || '');

    // limpar qualquer cor anterior
    limparCoresBackgroundOpcoes();

    if (escolhidaId === corretaId) {
        // acerto
        document.getElementById(chosen.labels[0].id).classList.add('text-success-with-bg');
        certas++;
        document.getElementById('spanCertas').innerHTML = certas;
    } else {
        // erro: marcar escolhida como errada e também marcar a correta como destaque
        document.getElementById(chosen.labels[0].id).classList.add('text-danger-with-bg');
        erradas++;
        document.getElementById('spanErradas').innerHTML = erradas;
        // marcar a alternativa correta para feedback
        if (corretaId) {
            const labels = ['labelOpcaoUm','labelOpcaoDois','labelOpcaoTres','labelOpcaoQuatro'];
            for (let i=0;i<labels.length;i++){
                const lab = document.getElementById(labels[i]);
                if (lab && String(lab.dataset.altId) === corretaId) {
                    lab.classList.add('text-success-with-bg');
                    break;
                }
            }
        }
    }
}

function limparCoresBackgroundOpcoes(){ const options = document.getElementsByName('option'); for (let i=0;i<options.length;i++){ if (options[i].labels && options[i].labels[0]){ document.getElementById(options[i].labels[0].id).classList.remove('text-danger-with-bg'); document.getElementById(options[i].labels[0].id).classList.remove('text-success-with-bg'); } } }

function finalizarJogo(){
    const porcentagemFinalDeAcertos = (quantidadeDeQuestoes>0) ? (certas/quantidadeDeQuestoes) : 0;
    let textoParaMensagemFinal = null; let classComCoresParaMensagemFinal = null;
    if (porcentagemFinalDeAcertos <= 0.3){ textoParaMensagemFinal = 'Parece que você não estudou...'; classComCoresParaMensagemFinal = 'text-danger-with-bg'; }
    else if (porcentagemFinalDeAcertos > 0.3 && porcentagemFinalDeAcertos < 0.9){ textoParaMensagemFinal = 'Pode melhorar na próxima, hein!'; classComCoresParaMensagemFinal = 'text-warning-with-bg'; }
    else { textoParaMensagemFinal = 'Uau, parabéns!'; classComCoresParaMensagemFinal = 'text-success-with-bg'; }
    textoParaMensagemFinal += '<br> Você acertou ' + Math.round((porcentagemFinalDeAcertos)*100) + '% das questões.';
    document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal; document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal);
    document.getElementById('spanPontuacaoFinal').innerHTML = certas;
    document.getElementById('jogo').classList.add('text-new-gray'); btnProx.disabled = true; btnSubmeter.disabled = true; btnTentarNovamente.disabled = false;
    // concluir tentativa no backend
    if (idTentativa){ fetch('/quiz/tentativa/' + idTentativa + '/concluir', { method: 'POST' }).then(r=>r.json()).then(function(res){ console.log('Resultado servidor:', res); }).catch(function(err){ console.error('erro ao concluir',err); }); }
}

function tentarNovamente(){
    // resetar estado do jogo para começar desde a primeira questão
    numeroDaQuestaoAtual = 0;
    certas = 0; erradas = 0; tentativaIncorreta = 0;
    document.getElementById('spanCertas').innerHTML = certas;
    document.getElementById('spanErradas').innerHTML = erradas;
    document.getElementById('msgFinal').innerHTML = '';
    document.getElementById('msgFinal').className = '';
    document.getElementById('jogo').classList.remove('text-new-gray');
    desmarcarRadioButtons(); limparCoresBackgroundOpcoes();
    preencherHTMLcomQuestaoAtual(0);
    document.getElementById('btnSubmeter').disabled = false;
    document.getElementById('btnProx').disabled = true;
    document.getElementById('btnTentarNovamente').disabled = true;
    // se houver uma tentativa no servidor, pode-se iniciar nova tentativa; opcional: reiniciar tentativa backend
}

// load quiz on page load
// tenta obter um quiz válido do backend ao carregar a página
function obterQuizPadrao() {
    // tenta buscar quizzes disponíveis e usar o primeiro como padrão
    fetch('/quiz').then(function (r) {
        if (!r.ok) return null;
        return r.json().catch(function () { return null; });
    }).then(function (lista) {
        if (lista && Array.isArray(lista) && lista.length > 0) {
            quizId = lista[0].id_quiz || lista[0].id || 1; // fallback para 1
            // habilita botão iniciar caso estivesse desabilitado
            var btn = document.getElementById('btnIniciar'); if (btn) { btn.disabled = false; }
            var msg = document.getElementById('msgSemQuiz'); if (msg) { msg.style.display = 'none'; }
        } else {
            // se não houver quizzes no backend, manter nulo e avisar o usuário
            quizId = null;
            console.warn('Nenhum quiz encontrado no backend; inicie manualmente definindo quizId se necessário.');
            var btn = document.getElementById('btnIniciar'); if (btn) { btn.disabled = true; }
            var msg = document.getElementById('msgSemQuiz'); if (msg) { msg.style.display = ''; }
        }
    }).catch(function () {
        console.warn('Não foi possível acessar /quiz; usando comportamento local (quizId indefinido).');
        var btn = document.getElementById('btnIniciar'); if (btn) { btn.disabled = true; }
        var msg = document.getElementById('msgSemQuiz'); if (msg) { msg.style.display = ''; }
    });
}

window.addEventListener('load', function(){ onloadEsconder(); carregarQuiz(); obterQuizPadrao(); });
</script>
</html>
